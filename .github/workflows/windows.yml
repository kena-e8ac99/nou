name: ci

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: >
          cmake -Bbuild -G "Visual Studio 17 2022" -T ClangCl
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S.
      - name: Build
        run: cmake --build build --config Debug -j4 --verbose
      - name: Test
        run: ctest --test-dir build --build-config Debug -j4 --verbose

