name: ci

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            build_type: Debug
          - os: macos-latest
            cxx: clang++
            build_type: Debug
          - os: windows-latest
            cxx: cl
            build_type: Debug
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: >
          cmake -Bbuild -DNinja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S.
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j4 --verbose
      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} -j4 --verbose
      - name: Run clang-tidy(macos only)
        if: matrix.cxx == clang++
        run: run-clang-tidy -p build test

