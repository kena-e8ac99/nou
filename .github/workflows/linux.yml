name: Linux

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [clang++-19]
        # Using g++-14 currently causes compilation errors due to lack of `mdspan` support.
        # cxx: [g++-14, clang++-19] 
    steps:
      - uses: actions/checkout@v6
      - name: Install g++-14
        if: matrix.cxx == 'g++-14'
        run: sudo apt update && sudo apt install -y g++-14 libstdc++-14-dev
      - name: Install clang-19
        if: matrix.cxx == 'clang++-19'
        run: sudo apt update && sudo apt install -y clang-19 clang-tidy-19 libc++-19-dev libc++abi-19-dev
      - name: Configure CMake
        run: >
          cmake -Bbuild -GNinja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -S.
      - name: Build
        run: cmake --build build --config Debug -j4 --verbose
      - name: Test
        run: ctest --test-dir build --build-config Debug -j4 --verbose
      - name: Run clang-tidy
        if: matrix.cxx == 'clang++-19'
        run: run-clang-tidy-19 -p build include
